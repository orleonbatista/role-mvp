name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # endereço atual do túnel até o LLM no PC (llm.json na raiz do repo; lido em tempo de execução)
          VITE_LLM_CONFIG_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/llm.json
          VITE_EVENTS_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/eventos.json
          # chave restrita ao domínio + só Places API + cotas diárias no Google Cloud (ver docs/05-operacao.md)
          VITE_PLACES_KEY: ${{ secrets.PLACES_KEY }}
      # SPA: qualquer rota desconhecida (ex.: /r/abc) cai no app
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
