name: E2E (jornadas no site publicado)

# Roda as jornadas principais num celular emulado depois de cada deploy e todo dia às 9h (BRT).
# Cria dados "[E2E]" e apaga no fim. Falhou? O GitHub avisa por e-mail; o relatório fica nos artefatos.
on:
  workflow_run:
    workflows: ['Deploy no GitHub Pages']
    types: [completed]
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  e2e:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: playwright-report, retention-days: 14 }
